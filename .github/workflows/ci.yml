# Lint, type-check, format check and build on every push and pull request. The geometry checks
# (npm run check / sweep) need a native OpenSCAD nightly and run locally (CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
